<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://api.github.com https://hq-decision-relay.ryoki63-hq.workers.dev">
<meta name="referrer" content="no-referrer">
<title>HQ ダッシュボード</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="views.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="planner.css">
<link rel="stylesheet" href="dark.css">
</head>
<body>
<header class="site-header">
  <div class="header-main">
    <h1 class="site-title">HQ ダッシュボード</h1>
    <p class="site-sub">オーナー専用</p>
  </div>
  <div class="header-meta" id="header-meta" aria-live="polite"></div>
  <button type="button" class="btn btn--ghost" id="theme-button" aria-pressed="false">ダーク</button>
  <button type="button" class="btn btn--ghost" id="lock-button" hidden>ロック</button>
</header>

<nav class="side-nav" aria-label="セクション">
  <p class="side-nav-title">ダッシュボード</p>
  <a href="#kpis">ひと目で見る状況</a>
  <a href="#decisions-panel">判断ボード</a>
  <a href="#phase">全体フェーズ</a>
  <a href="#agents">部署別の稼動</a>
  <a href="#models">モデル別の稼動</a>
  <a href="#finance">費用</a>
  <a href="#apps-panel">事業</a>
  <a href="#tasks-panel">タスク</a>
  <a href="#connections-panel">接続</a>
  <a href="#ops-panel">実行系の健康状態</a>
  <a href="#reports-panel">日報・学び</a>
</nav>

<main class="main">
  <section class="lock" id="lock-screen" aria-labelledby="lock-title" hidden>
    <h2 class="lock-title" id="lock-title">解錠</h2>
    <p class="lock-lead">パスフレーズを入力してください。入力したパスフレーズはこのタブの中だけに保持され、タブを閉じると消えます。</p>
    <form class="lock-form" id="lock-form" autocomplete="off">
      <label class="lock-label" for="passphrase">パスフレーズ</label>
      <input class="lock-input" id="passphrase" name="passphrase" type="password" required
             autocomplete="current-password" spellcheck="false" autocapitalize="off">
      <button class="btn btn--primary" type="submit" id="unlock-button">解錠する</button>
    </form>
    <p class="message" id="lock-message" role="alert"></p>
    <p class="hint">確認用: <a href="?demo=1">サンプルデータ（平文）で開く</a></p>
  </section>

  <div class="dash" id="dashboard" hidden></div>

  <p class="message message--error" id="boot-error" role="alert" hidden></p>
  <noscript><p class="message message--error">このダッシュボードは JavaScript が必要です。</p></noscript>
</main>

<footer class="site-footer">
  <p>HQ ダッシュボード — 画面はすべて復号したデータから描画しています。</p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
